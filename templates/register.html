{% extends 'base.html' %}

{% block title %}Register - DermaGlow-AI{% endblock %}

{% block content %}
    <section class="content-card auth-card">
        <p class="eyebrow">Begin your beauty journey</p>
        <h1>Create your personalized beauty profile</h1>
        <form method="post" class="auth-form">
            {% if error %}
                <div class="form-error">{{ error }}</div>
            {% endif %}

            <label class="field-label">Name</label>
            <input type="text" name="name" required>

            <label class="field-label">Email</label>
            <input type="email" name="email" required>

            <label class="field-label">Password</label>
            <input type="password" name="password" required>
            <label class="field-label">Age (optional)</label>
            <input type="text" name="age">

            <button class="button" type="submit">Register</button>
            <p class="form-footer">Already have an account? <a href="{{ url_for('login') }}">Login</a></p>
        </form>
    </section>
{% endblock %}
