{% extends 'base.html' %}

{% block title %}Login - DermaGlow-AI{% endblock %}

{% block content %}
    <section class="content-card auth-card">
        <p class="eyebrow">Welcome back to radiant skin</p>
        <h1>Login to DermaGlow-AI</h1>
        <form method="post" class="auth-form">
            {% if error %}
                <div class="form-error">{{ error }}</div>
            {% endif %}

            <label class="field-label">Email</label>
            <input type="email" name="email" required>

            <label class="field-label">Password</label>
            <input type="password" name="password" required>

            <button class="button" type="submit">Login</button>
            <p class="form-footer">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
        </form>
    </section>
{% endblock %}
